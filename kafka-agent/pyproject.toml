[project]
name = "kafka-agent"
version = "0.1.0"
description = "LangGraph AI agent for automating Kafka ZooKeeper to KRaft migration on OpenShift"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
include = ["src"]
